<script type="module">
    import { marked } from "https://esm.sh/marked@12";
    import DOMPurify from "https://esm.sh/dompurify@3";

    const SUPABASE_URL = "https://ftaqjencknwpdjogkabd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_7B7eOMRW3UggVVGixw0RqA_dXQVs587";
    const article = document.getElementById("article");
    const state = document.getElementById("state");

    const slug = new URLSearchParams(location.search).get("slug");

    function notFound() {
      state.innerHTML = 'That note isn’t here — it may have moved. <br><br><a class="back-link" href="blog.html">← Back to all Field Notes</a>';
    }

    if (!slug) {
      notFound();
    } else {
      // Column-level grants mean anon must name columns explicitly — never select=*
      fetch(`${SUPABASE_URL}/rest/v1/content_items?select=title,excerpt,blog_markdown,published_at&slug=eq.${encodeURIComponent(slug)}`, {
        headers: { apikey: SUPABASE_KEY },
      })
        .then((r) => r.json())
        .then((rows) => {
          if (!Array.isArray(rows) || !rows.length) return notFound();
          const post = rows[0];
          document.title = `${post.title} — Second Story Consulting`;
          document.querySelector('meta[name="description"]')?.setAttribute("content", post.excerpt ?? "");

          const date = new Date(post.published_at).toLocaleDateString("en-US", {
            year: "numeric", month: "long", day: "numeric",
          });

          // Strip a leading H1 from the markdown if it duplicates the title
          let md = post.blog_markdown ?? "";
          const firstLine = md.trimStart().split("\n")[0];
          if (firstLine.startsWith("# ")) md = md.trimStart().split("\n").slice(1).join("\n");

          state.remove();
          const dateEl = document.createElement("p");
          dateEl.className = "post-date";
          dateEl.textContent = date;
          const h1 = document.createElement("h1");
          h1.textContent = post.title;
          const body = document.createElement("div");
          body.className = "post-body";
          body.innerHTML = DOMPurify.sanitize(marked.parse(md));
          const back = document.createElement("a");
          back.className = "back-link";
          back.href = "blog.html";
          back.textContent = "← Back to all Field Notes";
          article.append(dateEl, h1, body, back);
        })
        .catch(notFound);
    }
  </script>
</body>
</html>
